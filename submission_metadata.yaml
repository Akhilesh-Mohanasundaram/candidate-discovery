methodology_summary: |
  Our system implements a hybrid, rule-aware ranking architecture designed to capture
  nuance beyond keyword matching. We process candidates through a rigorous 6-stage
  pipeline: (1) JD decomposition into HARD/SOFT/VETO tiers, (2) 7-rule honeypot
  detection for fabricated profiles, (3) 500+ feature engineering across career,
  education, and logistics, (4) MiniLM-L6-v2 semantic skill matching weighted by
  proficiency and duration, (5) 23-signal behavioral availability multiplier with
  exponential recency decay, and (6) deterministic candidate-specific reasoning
  generation. The system guarantees our top 100 shortlist is technically aligned,
  structurally sound, and actually hireable.
