methodology_summary: |
  Our system implements a hybrid, rule-aware ranking architecture designed to capture
  nuance beyond keyword matching. We process candidates through a rigorous 6-stage
  pipeline: (1) JD decomposition into HARD/SOFT/VETO tiers, (2) 7-rule honeypot
  detection for fabricated profiles, (3) multi-signal feature engineering across career,
  logistics, and YoE alignment, (4) MiniLM-L6-v2 semantic skill matching weighted by
  proficiency and duration (zero-duration skills strictly yield zero weight),
  (5) 23-signal behavioral availability multiplier with exponential recency decay
  across 5 weighted groups, and (6) deterministic candidate-specific reasoning
  generation grounded in actual profile data. All 7 honeypot traps and 6 JD VETO
  disqualifiers are applied as hard gates (score 0.0) before ranking. The system
  guarantees our top 100 shortlist is technically aligned, fraud-free, structurally
  sound, and actually hireable.
